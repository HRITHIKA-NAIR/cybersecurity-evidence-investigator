services:
  - type: web
    name: cybersecurity-evidence-investigator-api
    runtime: python
    rootDir: backend
    plan: free
    branch: feature/investigator-v2.2
    autoDeployTrigger: off
    healthCheckPath: /live
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MAX_WAITING
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_GEMINI
        value: "false"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ENABLE_VIRUSTOTAL
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: cybersecurity-evidence-investigator-web
    runtime: static
    rootDir: frontend
    branch: feature/investigator-v2.2
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: LAUNCH_READY
        value: "false"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.onrender.com https://*.supabase.co; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
